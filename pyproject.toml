[project]
name = "maibot-plugin-bilibili"
version = "1.0.3"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
description = "Bilibili subscriptions for MaiBot 1.3.16 and SnowLuma"
requires-python = ">=3.11"
dependencies = ["bilibili-api-python>=17.4.1,<18", "curl_cffi>=0.14.0,<1", "pycryptodomex>=3.23.0", "brotli>=1.2.0", "qrcode>=8.2,<9", "Pillow>=11,<13", "jinja2>=3.1.6,<4", "aiohttp>=3.12,<4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
